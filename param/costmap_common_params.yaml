# filepath: src/scout_nav/param/costmap_common_params.yaml
# ============================================================================
# costmap_common_params.yaml — 全局/局部代价地图共享的公共参数
# ============================================================================

# ============================================================================
# [1] 机器人足迹 footprint — 绝对对称几何推导（附完整数学证明）
# ============================================================================
#
# ┌──────────────── 严格物理推导过程 ────────────────┐
# │                                                    │
# │  Scout Mini 官方物理尺寸：                         │
# │    整车长度 L = 612mm = 0.612m                     │
# │    整车宽度 W = 580mm = 0.580m                     │
# │                                                    │
# │  base_link 的定义（来自 scout_mini.urdf.xacro）：  │
# │    base_link 原点 = 车体几何正中心                 │
# │    即 base_link 在长度方向的 L/2 处                │
# │           在宽度方向的 W/2 处                      │
# │                                                    │
# │  半长 = L/2 = 0.612/2 = 0.306m                    │
# │  半宽 = W/2 = 0.580/2 = 0.290m                    │
# │                                                    │
# │  ROS 坐标系约定（REP-103 右手系）：                │
# │    X 轴 = 车头前方（正方向）                       │
# │    Y 轴 = 车体左方（正方向）                       │
# │                                                    │
# │  四个角点坐标（严格关于原点绝对对称的矩形）：      │
# │                                                    │
# │    后右角: X = -半长 = -0.306, Y = -半宽 = -0.290  │
# │    后左角: X = -半长 = -0.306, Y = +半宽 = +0.290  │
# │    前左角: X = +半长 = +0.306, Y = +半宽 = +0.290  │
# │    前右角: X = +半长 = +0.306, Y = -半宽 = -0.290  │
# │                                                    │
# │  俯视图（Y↑ X→）：                                │
# │                                                    │
# │    (-0.306, +0.290) ┌──────────┐ (+0.306, +0.290) │
# │                 后左 │          │ 前左              │
# │                     │  (0,0)   │                   │
# │                     │ base_link│                   │
# │                 后右 │          │ 前右              │
# │    (-0.306, -0.290) └──────────┘ (+0.306, -0.290) │
# │                                                    │
# │                     车头 → (+X)                    │
# │                                                    │
# │  ⚠️⚠️⚠️ 绝对警告 ⚠️⚠️⚠️                          │
# │  雷达的前偏置（X = 0.12m）已由 TF 变换完全消化！  │
# │  TF 树: base_link → velodyne 的 X 分量 = 0.12m    │
# │  代价地图收到的 /scan 数据会自动通过 TF 转换到     │
# │  base_link 坐标系下。                              │
# │  因此 footprint 中 ★绝不允许★ 补偿雷达偏移！      │
# │  footprint 只描述车体自身的矩形物理轮廓！          │
# └────────────────────────────────────────────────────┘
#
footprint: [[-0.306, -0.290],[-0.306, 0.290],[0.306, 0.290], [0.306, -0.290]]

# footprint_padding: 足迹外扩安全余量（米）
# 在矩形轮廓外再加 2cm 安全边距
footprint_padding: 0

# ============================================================================
# [2] 传感器来源配置
# ============================================================================
observation_sources: scan_source

scan_source:
  # 输入话题：降维后的 2D LaserScan
  topic: /scan
  # 传感器坐标系（已在降维节点中转换到 base_link）
  sensor_frame: base_link
  # 数据类型
  data_type: LaserScan
  # 用此数据标记障碍物（激光击中点→代价值254）
  marking: true
  # 用此数据清除障碍物（激光穿过区域→代价值0）
  clearing: true
  
  # ★ 3D转2D 解决残影的必杀技 ★
  # 如果 3D 雷达线束打向高空或超出量程，降维后会输出 inf。
  # 必须设为 true，告诉 Costmap 用最大量程 (raytrace_range) 去发射射线清空残影！
  inf_is_valid: true
  
  # 障碍物检测最大距离（5m 内的障碍物参与代价地图）
  obstacle_range: 5.0
  # 射线追踪清除最大距离（必须大于 obstacle_range，6m 内的区域可被清除残影）
  raytrace_range: 6.0

# ============================================================================
# [3] 基础参数
# ============================================================================
# 机器人本体坐标系
robot_base_frame: base_link

# TF 变换时间容忍度（秒）
transform_tolerance: 0.5

# 栅格分辨率（与建图分辨率一致）
resolution: 0.025