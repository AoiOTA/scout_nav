# filepath: src/scout_nav/param/global_costmap_params.yaml
# ============================================================================
# global_costmap_params.yaml — 全局代价地图参数
#
# 覆盖整个已知地图区域，供全局路径规划器 (A*/Dijkstra) 使用
# 由 static_layer + obstacle_layer + inflation_layer 三层叠加
# ============================================================================
global_costmap:

  # 全局坐标系（AMCL 发布 map→odom）
  global_frame: map
  robot_base_frame: base_link

  # 更新/发布频率
  update_frequency: 3.0
  publish_frequency: 1.0

  # 使用静态地图（来自 map_server）
  static_map: true
  rolling_window: false

  # 分辨率
  resolution: 0.05
  transform_tolerance: 0.5

  # 代价地图层配置
  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  static_layer:
    map_topic: /map
    subscribe_to_updates: true

  obstacle_layer:
    observation_sources: scan_source
    scan_source:
      topic: /scan
      sensor_frame: base_link
      data_type: LaserScan
      marking: true
      clearing: true
      inf_is_valid: true
      obstacle_range: 5.0
      raytrace_range: 6.0

  inflation_layer:
    # ★ 实车量产修改：全局膨胀 U 型谷制造机 ★
    # inflation_radius: 障碍物膨胀半径（米）
    # 设为 1.0m，让走廊等狭窄通道完全被膨胀区覆盖，为底层数学梯度铺路。
    inflation_radius: 0.5

    # cost_scaling_factor: 代价衰减速度
    # ★ 必须调小！★ 设为 2.0，让膨胀斜坡极其平缓。
    # 结合 GlobalPlanner，红线会像水流一样自动流向通道的正中间（代价最低谷）。
    cost_scaling_factor: 10