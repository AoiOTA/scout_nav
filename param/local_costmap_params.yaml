# filepath: src/scout_nav/param/local_costmap_params.yaml
# ============================================================================
# local_costmap_params.yaml — 局部代价地图参数
#
# 只覆盖机器人周围的滚动窗口，供局部规划器 (TEB) 使用
# 由 obstacle_layer + inflation_layer 两层叠加（不需要 static_layer）
# ============================================================================
local_costmap:

  # 使用里程计坐标系（局部规划只关注短期运动）
  global_frame: odom
  robot_base_frame: base_link

  # 更新频率（局部避障需要更高实时性）
  update_frequency: 10.0  # 提至 10Hz，应对突然窜出的行人
  publish_frequency: 3.0

  # 滚动窗口（不基于静态地图）
  static_map: false
  rolling_window: true

  # 窗口大小 6m × 6m（前后左右各 3m，必须覆盖 TEB 的 3.0m 前瞻距离）
  width: 6.0
  height: 6.0

  resolution: 0.05
  transform_tolerance: 0.5

  # 代价地图层
  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    observation_sources: scan_source
    scan_source:
      topic: /scan
      sensor_frame: base_link
      data_type: LaserScan
      marking: true
      clearing: true
      inf_is_valid: true
      obstacle_range: 5.0
      raytrace_range: 6.0

  inflation_layer:
    # ★ 实车量产修改：局部陡峭悬崖制造机 ★
    # 局部膨胀半径稍微包住车身即可。
    inflation_radius: 0.4
    
    # ★ 必须调大！★ 设为 8.0。
    # 让代价斜坡非常陡峭，给 TEB 明确的信号："只要没碰到致命内切区，你都可以贴着边缘极限避障"。
    cost_scaling_factor: 8.0