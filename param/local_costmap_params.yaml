# filepath: src/scout_nav/param/local_costmap_params.yaml
# ============================================================================
# local_costmap_params.yaml — 局部代价地图参数
# 穿障修复版：保证障碍物正确标记，膨胀区生效
# ============================================================================
local_costmap:

  global_frame: odom
  robot_base_frame: base_link

  # 更新频率和规划频率对齐，避免噪点累积
  update_frequency: 10.0
  publish_frequency: 5.0

  static_map: false
  rolling_window: true

  # ⚠️ 穿障修复：恢复4m×4m窗口，让机器人看到完整的障碍物轮廓
  width: 4.0
  height: 4.0

  resolution: 0.05
  transform_tolerance: 0.5
  track_unknown_space: false

  # 只保留实时障碍物层+膨胀层，不加载全局静态地图，避免双重约束
  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    observation_sources: scan_source
    scan_source:
      topic: /scan
      sensor_frame: base_link
      data_type: LaserScan
      # ⚠️ 穿障修复：强制开启marking和clearing，激光能正确标记/清除障碍物
      marking: true
      clearing: true
      obstacle_range: 3.5
      raytrace_range: 4.5
      # 过滤地面反光和单帧噪点，避免虚假障碍物
      min_obstacle_height: 0.05
      max_obstacle_height: 1.8
      obstacle_range_min: 0.15

  inflation_layer:
    # ⚠️ 穿障修复：恢复到0.35m，必须大于机器人半宽0.29m，膨胀区绝对生效
    inflation_radius: 0.35
    # ⚠️ 穿障修复：恢复到10.0，代价增长更合理，不会太松导致贴墙
    cost_scaling_factor: 10.0
