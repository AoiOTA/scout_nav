# ============================================================================
# TEB Local Planner - 对标 NeuPAN (极限窄门与突发避障融合版)
# 核心策略：极低惩罚区保走廊平稳 + 超高密度离散点保瞬间闪避 + 释放运动学弹性
# ============================================================================

TebLocalPlannerROS:

  # ============================================================================
  # [1] 机器人物理轮廓 (Footprint)
  # ============================================================================
  footprint_model:
    type: "polygon"
    vertices: [[-0.306, -0.290],[-0.306, 0.290],[0.306, 0.290],[0.306, -0.290]] 

  # ============================================================================
  # [2] 动力学与物理红线 (Dynamics) (对标 NeuPAN max_acce)
  # ============================================================================
  max_vel_x: 0.6            # 【对标】最高巡航速度 0.6m/s
  max_vel_x_backwards: 0.2  
  max_vel_y: 0.0            
  max_vel_theta: 1.5        # 【对标】限制最高角速度，防止差速车画大龙

  acc_lim_x: 0.8            # 线加速度 0.8
  acc_lim_y: 0.0            
  acc_lim_theta: 1.5        # 【⭐ 破局 1：解封角加速度】
                            # 必须给足 1.5 的角加速度！这是出洞后 0.5 秒内能把车头甩出 30 度的唯一物理保障。

  min_turning_radius: 0.0   
  wheelbase: 0.451          
  cmd_angle_instead_rotvel: false 

  # ============================================================================
  #[3] 极限避障参数 (Obstacles) - ★ 对标 NeuPAN 动态气囊 ★
  # ============================================================================
  min_obstacle_dist: 0.01   # 【⭐ 破局 2：物理死线】
                            # 对应 NeuPAN 的 d_min。单侧空隙 6cm，死线设为 2cm，留出 4cm 的数学缓冲区。
  penalty_epsilon: 0.01     # 数学缓冲带 2cm
  
  inflation_dist: 0.35      # 【⭐ 破局 3：消除幽闭恐惧】
                            # 极其关键！从 0.50 暴降至 0.15！
                            # 对应 NeuPAN 极低的 \eta。在 6cm 处，惩罚值 ((0.06-0.15)/(0.02-0.15))^2 * 50 ≈ 23。
                            # 这个惩罚值足够小，机器人不会觉得“被夹扁”，从而消除了走廊里的“疯狂画龙”和“死锁停机”。
  
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0 
  obstacle_poses_affected: 30              
  costmap_converter_plugin: ""

  # ============================================================================
  # [4] 优化器权重博弈 (Optimization Weights) - ★ 对标 NeuPAN 姿态解绑 ★
  # ============================================================================
  weight_optimaltime: 3   # 【下调】降低对时间的贪婪，允许它在弯道减速。
  
  weight_viapoint: 0.2      # 【⭐ 破局 4：解绑全局路径】
                            # 对应 NeuPAN 的低 q_s[2]。大幅降低该权重，允许 TEB 的橡皮筋在出洞时完全挣脱全局参考线（绿线），大幅度弯曲以避开 50cm 处的障碍。
  
  weight_obstacle: 200     # 【提高】对应 NeuPAN 的 ro_obs=120。确保障碍物斥力能够轻易击穿寻迹拉力。
  weight_inflation: 3.5     # 给 0.15m 膨胀区一点柔和的引导。

  weight_kinematics_nh: 1000.0             
  weight_kinematics_forward_drive: 50.0    # 稍微降一点，允许极度危险时微小的倒车重试。
  weight_kinematics_turning_radius: 0.0    

  weight_max_vel_x: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_theta: 1.0
  weight_adapt_factor: 2.0

  # ============================================================================
  # [5] 轨迹配置与分辨率 (Trajectory) - ★ 解决出洞穿模 ★
  # ============================================================================
  xy_goal_tolerance: 0.15   
  yaw_goal_tolerance: 0.2   
  free_goal_vel: false      

  max_global_plan_lookahead_dist: 2  # 【缩短视野】对应 NeuPAN 的 1.2s 视野。防止提前看到洞外障碍物导致走廊内死锁。
  
  global_plan_viapoint_sep: 0.5 # 保持 0.4，给橡皮筋足够的扭动自由度。
  
  global_plan_overwrite_orientation: true 
  allow_init_with_backwards_motion: false 

  teb_autosize: true
  
  dt_ref: 0.1               # 【⭐ 破局 5：超高密度采样】
                            # 从 0.2 降至 0.1！对应 NeuPAN 连续数学力场的优势。
                            # 点间距缩短到 0.06m。哪怕障碍物只有 50cm，橡皮筋上也会有 8 个点死死贴住它，绝对不会穿模！
                            
  dt_hysteresis: 0.03       
  max_samples: 500          
  no_inner_iterations: 5    
  no_outer_iterations: 4    

  # ============================================================================
  #[6] 拓扑并行规划 (Homotopy Class)
  # ============================================================================
  enable_homotopy_class_planning: false # 【必须关闭】70cm 通道里绝对不能开，否则瞬间卡死。

  enable_multithreading: true           
  max_number_classes: 4                 
  selection_cost_hysteresis: 1.0        
  selection_prefer_initial_plan: 0.95