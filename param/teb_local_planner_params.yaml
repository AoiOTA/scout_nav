# filepath: src/scout_nav/param/teb_local_planner_params.yaml
# ============================================================================
# TEB (Timed Elastic Band) 时间弹性带局部规划器参数配置
#
# 【核心调优哲学】
# 1. 绝对信任：完全信任 GlobalPlanner A* 算出的居中平滑曲线，强迫底盘紧紧跟随。
# 2. 破除犹豫：斩断 TEB 试图“倒车微调”或“多路径摇摆”的念头，坚决杜绝原地抽搐。
# 3. 勇闯窄门：极限压榨安全距离，配合 Costmap 的陡峭悬崖，死磕狭窄通道！
# ============================================================================

TebLocalPlannerROS:

  # ============================================================================
  # [1] 轨迹参数 (Trajectory)
  # ============================================================================

  # 是否允许系统自动根据速度/加速度极值调整轨迹点之间的时间间隔
  teb_autosize: true

  # 期望的轨迹点时间间隔 (秒)。
  # 设为 0.3 秒意味着：如果车速是 0.5m/s，那么轨迹点之间的物理距离大约是 0.15m。
  # 调小会使轨迹更细腻，但急剧增加 CPU 计算负担。
  dt_ref: 0.3

  # 时间步长的迟滞缓冲范围，防止优化器在增减轨迹点时产生震荡
  dt_hysteresis: 0.1

  # 一次局部规划生成的最大轨迹点数量，限制无上限的计算
  max_samples: 500

  # ★ 覆盖全局路径朝向 ★
  # 全局路径 (A*) 通常只有 X,Y 坐标，不包含合理的偏航角 (Yaw)。
  # 设为 true，让 TEB 根据轨迹的切线方向自动为每个点计算出合理的车头朝向。
  global_plan_overwrite_orientation: true

  # 是否允许机器人以倒车姿态起步（如果终点在车后，且倒车代价更小）
  allow_init_with_backwards_motion: true

  # ★ 局部规划前瞻距离 ★ (单位：米)
  # TEB 往前方看多远。设为 3.0m，意味着 TEB 只截取全局红线前方 3 米的部分进行优化。
  # ⚠️ 注意：局部代价地图 Local Costmap 的长宽必须能包住这个距离！
  max_global_plan_lookahead_dist: 3.0

  # ★ 全局路径跟随 (死磕红线机制) ★
  # 在全局路径上，每隔多远（米）放置一个“引力点 (Via-point)”来生拉硬拽住 TEB 的绿线。
  # 0.4m: 因为现在的全局红线已经是 A* 平滑过的完美曲线，设密集一点，强迫车子贴着中轴线走。
  global_plan_viapoint_sep: 0.4

  # 经由点是否必须严格按顺序通过。设为 false 允许底盘在极度扭曲时跳过某些引力点。
  via_points_ordered: false

  # ============================================================================
  # [2] 速度极值 (Velocity)
  # ============================================================================
  max_vel_x: 0.5            # 最大前进线速度 (m/s)
  max_vel_x_backwards: 0.2  # 最大倒车线速度 (m/s)。实车必须限制倒车速度防撞！
  max_vel_y: 0.0            # 最大侧向速度 (m/s)。Scout Mini 是滑移转向，无法侧移，必须为 0！
  max_vel_theta: 1.0        # 最大旋转角速度 (rad/s)

  # ============================================================================
  # [3] 加速度限制 (Acceleration)
  # ============================================================================
  acc_lim_x: 1.0            # 最大线加速度 (m/s^2)
  acc_lim_y: 0.0            # 最大侧向加速度 (m/s^2)。必须为 0！
  acc_lim_theta: 2.0        # 最大角加速度 (rad/s^2)

  # ============================================================================
  #[4] 运动学约束 (Kinematics) - ⚠️ 适配滑移转向底盘的关键 ⚠️
  # ============================================================================
  
  # ★ 最小转弯半径 ★ (米)
  # Scout Mini 是差速/滑移转向底盘，可以原地打转，必须设为 0.0！
  # 只有阿克曼转向（汽车结构）才需要设为大于 0 的真实转弯半径。
  min_turning_radius: 0.0
  
  # 轴距 (米)。虽然滑移转向可以原地转，但 TEB 内部公式仍需要此参数。Scout Mini 轴距为 451mm。
  wheelbase: 0.451
  
  # 是否发送方向盘转角 (舵角) 指令。差速/滑移底盘用的是角速度，必须设为 false。
  cmd_angle_instead_rotvel: false

  # ============================================================================
  # [5] 目标点容忍度 (Goal Tolerance)
  # ============================================================================
  xy_goal_tolerance: 0.15   # 到达目标点时的 XY 坐标允许误差 (米)
  yaw_goal_tolerance: 0.2   # 到达目标点时的朝向角允许误差 (弧度，约 11.4 度)
  
  # 到达终点时是否允许拥有剩余速度。设为 false，确保车子在终点完全刹停。
  free_goal_vel: false

  # ============================================================================
  # [6] 障碍物避让参数 (Obstacles)
  # ============================================================================

  # ★ 狭窄通道通行底线（致命防线） ★
  # 轨迹与障碍物之间试图保持的“最小绝对安全距离”(米)。
  # 车宽 58cm，如果通道只有 70-80cm，这个值必须压榨到极小！
  # 设为 0.1m。设大了，遇到窄门 TEB 发现左右都不满足要求，宁愿原地死机抽搐也绝不往前开。
  min_obstacle_dist: 0.10

  # 障碍物软约束膨胀距离 (米)。在此距离内的轨迹会被施加额外的惩罚代价，但不是绝对禁区。
  inflation_dist: 0.4
  
  # 是否将 Local Costmap 里的障碍物纳入 TEB 避障考虑？(必须为 true！)
  include_costmap_obstacles: true
  
  # 忽略车身后面多远的障碍物 (米)。倒车需求不高时设短一点，极大节省 CPU 算力。
  costmap_obstacles_behind_robot_dist: 1.5
  
  # 每个障碍物最多影响其周围多少个轨迹点。默认 30。
  obstacle_poses_affected: 30
  
  # 障碍物多边形转换插件，留空表示使用默认的按点处理。
  costmap_converter_plugin: ""

  # ============================================================================
  # [7] 优化器权重参数 (Optimization Weights) - ★ 调参灵魂所在 ★
  # ============================================================================
  no_inner_iterations: 5    # 图优化器内层迭代次数
  no_outer_iterations: 4    # 图优化器外层迭代次数
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.1      # 软约束惩罚的缓冲阈值

  # 物理极值权重（尽量保持默认）
  weight_max_vel_x: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_theta: 1.0
  
  # 非完整性运动学约束权重。极大权重 (1000) 意味着严格禁止底盘产生 Y 轴侧滑！
  weight_kinematics_nh: 1000.0

  # ★ 治疗原地抽搐的神药 ★ (前向行驶偏好)
  # 设为 100.0：狠狠拉满！当在狭窄通道遇到微小噪点时，强迫机器人硬着头皮往前钻，
  # 彻底斩断它试图“先倒车调整一下姿态”而导致的疯狂抽搐震荡。
  weight_kinematics_forward_drive: 100.0
  
  # 转弯半径权重。我们允许原地打转，设为 0。
  weight_kinematics_turning_radius: 0.0

  # ★ 放弃赛车手思维 ★ (最优时间权重)
  # 设为 0.3：适当调小它。TEB 默认喜欢追求极致时间，容易为了省那 1 秒钟去抄近道、极度贴墙切内角。
  # 调小此值，让机器人走得更佛系、更安全。
  weight_optimaltime: 0.3
  
  # 最短路径权重（通常设为0，靠 optimaltime 调节即可）
  weight_shortest_path: 0.0

  # 障碍物排斥权重
  # 设为 50.0：适度排斥即可。结合前面 0.1m 的极小安全距离，让车既不想撞墙，又敢于钻洞。
  weight_obstacle: 50.0
  
  # 膨胀区排斥权重
  weight_inflation: 0.2

  # ★ 绝对信任 A* 全局红线 ★ (经由点吸引权重)
  # 设为 10.0：狠狠调大！由于 A* 已经算出了完美的居中曲线，
  # 告诉 TEB："别自作聪明找捷径了，全局红线就是圣旨，你必须乖乖顺着红线走！"
  weight_viapoint: 10.0
  
  weight_adapt_factor: 2.0

  # ============================================================================
  # [8] 多拓扑路径探索 (Homotopy Class Planning)
  # ============================================================================

  # ★ 狭窄通道的万恶之源：多路径并行探索 ★
  # enable_homotopy_class_planning: 必须关闭 (false)！
  # 解释：在狭长走廊和门洞里，雷达噪点稍微闪烁，TEB 就会在瞬间算出"从左边绕"和"从右边绕"两条拓扑路径，
  # 导致绿线像闪电一样来回横跳，底盘直接懵逼原地抽搐。
  # 关闭它，让 TEB 死心塌地顺着当前唯一的绿线走，不仅治抽搐，CPU 负载还能瞬间降低 40%！
  enable_homotopy_class_planning: false

  enable_multithreading: true           # 开启多线程运算
  max_number_classes: 4                 # 最大并行拓扑路径数 (关闭多拓扑后此参数失效)
  selection_cost_hysteresis: 1.0        # 路径切换的代价迟滞阈值
  selection_prefer_initial_plan: 0.95   # 强烈偏好与全局红线拓扑一致的那条路径

  # ============================================================================
  # [9] 机器人真实物理足迹模型 (Footprint Model)
  # ============================================================================
  # ⚠️ 致命警告：量产车必须使用多边形 (polygon) 且必须与 Costmap 的 footprint 绝对一致！
  # 绝对不能用 point 或 circular！如果是圆形外接模型，车子永远进不了 80cm 的门洞！
  # 此处数据对应 Scout Mini 真实物理尺寸 (长 0.612m, 宽 0.580m) 关于车体中心的绝对对称坐标。
  footprint_model:
    type: "polygon"
    vertices: [[-0.306, -0.290],[-0.306, 0.290], [0.306, 0.290],[0.306, -0.290]]