# filepath: src/scout_nav/param/teb_local_planner_params.yaml
# ============================================================================
# TEB (Timed Elastic Band) 时间弹性带局部规划器
#
# 核心算法原理：
#   1. 将全局路径离散为一系列带时间戳的"姿态节点" (x, y, θ, Δt)
#   2. 将这些节点视为"弹性带"，每个节点之间用"弹性"连接
#   3. 通过 g2o 图优化框架，同时优化：
#      - 几何约束：轨迹远离障碍物、贴合全局路径
#      - 运动学约束：速度/加速度不超极值、满足底盘运动模型
#      - 时间约束：最小化总行驶时间
#   4. 独有的多拓扑路径探索：同时维护多条拓扑不同的候选路径
#      （例如障碍物的左绕和右绕），选择代价最低的一条
#
# 相比 DWA 的优势：
#   - 一次规划整条局部路径（而非逐段弧线）→ 更擅长穿越狭窄通道
#   - 原生支持倒车规划
#   - 多拓扑探索避免陷入局部最优
#
# 适用场景：狭窄走廊、U 型弯、门洞、动态障碍物
# ============================================================================
TebLocalPlannerROS:

  # ============================================================================
  # [1] 轨迹参数
  # ============================================================================

  # teb_autosize: 是否自动调整时间步长
  # true: 根据速度/加速度约束自动优化相邻节点的时间间隔
  teb_autosize: true

  # dt_ref: 参考时间步长（秒）
  # ⚠️ 优化：0.3 -> 0.4
  # 增大时间间隔，减少轨迹点密度，大幅降低计算量，解决卡顿
  # 0.4s: 以 0.5m/s 行驶时，节点间距约 0.2m
  dt_ref: 0.4

  # dt_hysteresis: 时间步长迟滞（秒）
  # 防止步长在 dt_ref 附近频繁振荡
  dt_hysteresis: 0.1

  # max_samples: 轨迹最大节点数
  # ⚠️ 优化：500 -> 150
  # 原500过大导致计算爆炸，150足够覆盖4m前瞻距离，彻底解决控制频率低
  max_samples: 150

  # global_plan_overwrite_orientation: 是否重写全局路径点的朝向
  # true: TEB 根据运动方向重新计算朝向（全局路径通常不含朝向信息）
  global_plan_overwrite_orientation: true

  # allow_init_with_backwards_motion: 是否允许以倒车开始
  # ⚠️ 优化：true -> false
  # 【核心修改】强制禁止初始倒车，从根源解决"频繁倒车"问题
  allow_init_with_backwards_motion: false

  # max_global_plan_lookahead_dist: 全局路径前瞻距离（米）
  # ⚠️ 优化：3.0 -> 4.0
  # 稍微增大前瞻，让机器人看得更远，提前规划窄道，减少原地犹豫
  max_global_plan_lookahead_dist: 4.0

  # global_plan_viapoint_sep: 全局路径上经由点间距（米）
  # ⚠️ 优化：0.3 -> 0.8
  # 【核心修改】增大间距，避免对全局路径"盯得太紧"，解决在窄道中来回微调（摇摆）
  global_plan_viapoint_sep: 0.8

  # via_points_ordered: 经由点是否必须按顺序通过
  # false: 更灵活，允许 TEB 跳过某些经由点
  via_points_ordered: false

  # ============================================================================
  # [2] 速度极值（与 DWA 保持一致）
  # ============================================================================

  # max_vel_x: 最大前进线速度（m/s）
  max_vel_x: 0.5

  # max_vel_x_backwards: 最大倒车线速度（m/s）
  # 0.2: 倒车限速（安全优先）
  max_vel_x_backwards: 0.2

  # max_vel_y: 最大侧向线速度
  # 0.0: 滑移转向底盘不能侧移
  max_vel_y: 0.0

  # max_vel_theta: 最大旋转角速度（rad/s）
  # ⚠️ 优化：1.0 -> 1.5
  # 稍微提高转向速度，让机器人在窄道中调整姿态更果断，减少拖泥带水
  max_vel_theta: 1.5

  # ============================================================================
  # [3] 加速度限制（与 DWA 保持一致）
  # ============================================================================

  acc_lim_x: 1.0
  acc_lim_y: 0.0
  # ⚠️ 优化：2.0 -> 2.5
  # 提高角加速度响应，让启停和转向更干脆，解决"一顿一顿"的滞后感
  acc_lim_theta: 2.5

  # ============================================================================
  # [4] 运动学约束（⚠️ 适配滑移转向底盘的关键 ⚠️）
  # ============================================================================

  # min_turning_radius: 最小转弯半径（米）
  # ⚠️⚠️⚠️ 滑移转向底盘的核心参数 ⚠️⚠️⚠️
  # 0.0: 滑移转向底盘可以原地旋转（转弯半径 = 0）
  #       旋转中心与车体几何中心严格重合
  # 如果设为非零值，TEB 会禁止急转弯（仅 Ackermann 底盘需要非零值）
  min_turning_radius: 0.0

  # wheelbase: 轴距（米）
  # Scout Mini 轴距 451mm = 0.451m
  # 对滑移转向底盘此参数不影响运动学（因为不是 Ackermann 转向）
  # 但 TEB 内部仍需要一个值
  wheelbase: 0.451

  # cmd_angle_instead_rotvel: 是否发送转向角而非角速度
  # false: 发送角速度 cmd_vel.angular.z（滑移转向底盘用角速度控制）
  # true: 发送转向角（仅 Ackermann 底盘）
  cmd_angle_instead_rotvel: false

  # ============================================================================
  # [5] 目标容忍度
  # ============================================================================

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.2

  # free_goal_vel: 到达目标时是否允许非零速度
  # false: 必须停稳
  free_goal_vel: false

  # ============================================================================
  # [6] 障碍物参数
  # ============================================================================

  # min_obstacle_dist: 轨迹与障碍物的最小允许距离（米）
  # ⚠️ 优化：0.30 -> 0.25
  # 【核心修改】稍微缩小硬约束距离（原0.3约等于车宽，太保守）
  # 给机器人多5cm空间，避免在窄道中"左右为难"导致停滞
  min_obstacle_dist: 0.25

  # inflation_dist: 障碍物软约束膨胀距离（米）
  # ⚠️ 优化：0.5 -> 0.4
  # 缩小膨胀区，减少不必要的减速和犹豫，让机器人更敢靠近窄道边缘
  inflation_dist: 0.4

  # include_costmap_obstacles: 是否从局部代价地图读取障碍物
  include_costmap_obstacles: true

  # costmap_obstacles_behind_robot_dist: 忽略身后多远的障碍物（米）
  # 减少不必要的计算
  costmap_obstacles_behind_robot_dist: 1.5

  # obstacle_poses_affected: 每个障碍物影响的最近路径节点数
  obstacle_poses_affected: 30

  # costmap_converter_plugin: 代价地图转换器（空=不使用）
  costmap_converter_plugin: ""

  # ============================================================================
  # [7] 优化参数
  # ============================================================================

  # no_inner_iterations: 每轮外部迭代中的内部 g2o 求解步数
  # ⚠️ 优化：5 -> 4
  # 减少迭代次数，换取更快的计算速度（牺牲极小精度，换丝滑控制）
  no_inner_iterations: 4

  # no_outer_iterations: 外部迭代轮数
  # ⚠️ 优化：4 -> 3
  # 【核心修改】总优化步数 = 3 × 4 = 12 步/周期（原20步）
  # 这是提高控制频率、解决"一顿一顿"最直接的手段
  no_outer_iterations: 3

  optimization_activate: true
  optimization_verbose: false

  # penalty_epsilon: 软约束惩罚缓冲区
  penalty_epsilon: 0.1

  # weight_max_vel_x: 最大线速度约束权重
  weight_max_vel_x: 2.0

  # weight_max_vel_theta: 最大角速度约束权重
  weight_max_vel_theta: 1.0

  # weight_acc_lim_x: 线加速度限制权重
  weight_acc_lim_x: 1.0

  # weight_acc_lim_theta: 角加速度限制权重
  weight_acc_lim_theta: 1.0

  # weight_kinematics_nh: 非完整约束权重
  # 1000: 极大权重→严格禁止侧向运动（滑移转向底盘无法侧移）
  weight_kinematics_nh: 1000.0

  # weight_kinematics_forward_drive: 前向行驶偏好权重
  # ⚠️ 优化：1.0 -> 200.0
  # 【核心修改】极大提高前向权重，从"轻微偏好"变为"强制要求"
  # 彻底解决"遇到点情况就想倒车"的问题
  weight_kinematics_forward_drive: 200.0

  # weight_kinematics_turning_radius: 转弯半径约束权重
  # 0.0: 滑移转向可原地转，无需转弯半径约束
  weight_kinematics_turning_radius: 0.0

  # weight_optimaltime: 最优时间权重
  # 1.0: 中等→平衡速度与安全
  weight_optimaltime: 1.0

  # weight_shortest_path: 最短路径权重
  weight_shortest_path: 0.0

  # weight_obstacle: 障碍物排斥权重
  # ⚠️ 优化：100.0 -> 50.0
  # 【核心修改】降低障碍物敏感度，从"极度恐惧"变为"保持警惕"
  # 解决机器人因两边有墙而"吓瘫"、原地摇摆的问题
  weight_obstacle: 50.0

  # weight_inflation: 膨胀区域代价权重
  weight_inflation: 0.2

  # weight_viapoint: 经由点吸引权重
  # ⚠️ 优化：1.0 -> 0.8
  # 稍微降低对全局路径的粘性，给机器人更多自由空间在窄道中调整
  weight_viapoint: 0.8

  # weight_adapt_factor: 自适应权重放大因子
  weight_adapt_factor: 2.0

  # ============================================================================
  # [8] 多拓扑路径探索（TEB 独有黑科技）
  # ============================================================================

  # enable_homotopy_class_planning: 启用多拓扑路径
  # true: 同时探索多条拓扑不同的路径（如左绕/右绕障碍物）
  enable_homotopy_class_planning: true

  # enable_multithreading: 多线程优化
  enable_multithreading: true

  # max_number_classes: 最多同时维护的候选路径数
  # ⚠️ 优化：4 -> 2
  # 【核心修改】减少候选路径。原4条会导致机器人在窄道中反复纠结"走左还是走右"
  # 只保留2条（当前路径+最优备选），减少决策负担，解决原地摇摆
  max_number_classes: 2

  # selection_cost_hysteresis: 路径选择迟滞
  # 1.0: 当前路径代价必须明显高于其他路径才切换
  selection_cost_hysteresis: 1.0

  # selection_prefer_initial_plan: 偏好初始路径权重
  # ⚠️ 优化：0.95 -> 0.8
  # 稍微降低对初始路径的执念，但依然优先跟随全局路径，增加灵活性
  selection_prefer_initial_plan: 0.8

  # ============================================================================
  # [9] 足迹模型
  # ============================================================================
  # 与 costmap_common_params.yaml 的 footprint 完全一致
  # ⚠️ 必须保持绝对对称！
  footprint_model:
    type: "polygon"
    vertices: [[-0.306, -0.290], [-0.306, 0.290], [0.306, 0.290], [0.306, -0.290]]
