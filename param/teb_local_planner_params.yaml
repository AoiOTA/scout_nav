# filepath: src/scout_nav/param/teb_local_planner_params.yaml
# ============================================================================
# TEB (Timed Elastic Band) 时间弹性带局部规划器
# 穿障修复版：平衡避障安全+窄道通行能力，绝对不穿障
# ============================================================================
TebLocalPlannerROS:

  # ============================================================================
  # [1] 轨迹参数
  # ============================================================================

  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  max_samples: 150
  global_plan_overwrite_orientation: true

  # 允许倒车自救，不会卡死
  allow_init_with_backwards_motion: true

  # ⚠️ 穿障修复：前瞻恢复到3.0m，让机器人看得更远，提前识别完整障碍物
  max_global_plan_lookahead_dist: 3.0

  # ⚠️ 穿障修复：路点间距恢复到0.3m，既走中间，又给避障留调整空间
  global_plan_viapoint_sep: 0.3
  via_points_ordered: true
  exact_arc_length: true
  shrink_horizon_backup: true
  escape_recovery_enabled: true
  trajectory_infeasible_recovery_enabled: true

  # ============================================================================
  # [2] 速度极值
  # ============================================================================

  max_vel_x: 0.6
  max_vel_x_reference: 0.35 # 窄道平衡速度，既不慢又能及时避障
  max_vel_x_backwards: 0.3
  max_vel_y: 0.0
  max_vel_theta: 3.14
  min_vel_x: 0.0 # 允许停下，避免死锁

  # ============================================================================
  # [3] 加速度限制（保持你的需求）
  # ============================================================================

  acc_lim_x: 0.6
  acc_lim_y: 0.0
  acc_lim_theta: 0.6

  # ============================================================================
  # [4] 运动学约束（滑移转向底盘适配）
  # ============================================================================

  min_turning_radius: 0.0
  wheelbase: 0.451
  cmd_angle_instead_rotvel: false

  # ============================================================================
  # [5] 目标容忍度
  # ============================================================================

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.2
  free_goal_vel: false

  # ============================================================================
  # [6] 障碍物参数（穿障修复核心！）
  # ============================================================================

  # ⚠️ 穿障修复：最小安全距离恢复到0.2m，守住安全底线，绝对不能小于0.15m
  min_obstacle_dist: 0.2
  inflation_dist: 0.3
  include_costmap_obstacles: true # 必须开启，否则TEB读不到代价地图的障碍物

  # 忽略身后0.5m以外的障碍物，不被身后干扰
  costmap_obstacles_behind_robot_dist: 0.5

  # ⚠️ 穿障修复：从20改成30，每个障碍物影响更多轨迹点，避免局部路径穿障
  obstacle_poses_affected: 30
  costmap_converter_plugin: ""
  include_dynamic_obstacles: false

  # ============================================================================
  # [7] 优化参数（穿障修复核心！）
  # ============================================================================

  # ⚠️ 穿障修复：恢复迭代次数，保证优化收敛，满足避障约束
  no_inner_iterations: 4
  no_outer_iterations: 3
  optimization_activate: true
  optimization_verbose: false

  # ⚠️ 穿障修复：从0.2降到0.1，收紧软约束，硬避障约束绝对生效
  penalty_epsilon: 0.1

  weight_max_vel_x: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_theta: 1.0
  weight_kinematics_nh: 1000.0

  # 前向权重150，优先前进，但卡死时能倒车
  weight_kinematics_forward_drive: 150.0

  weight_kinematics_turning_radius: 0.0
  weight_optimaltime: 0.2
  weight_velocity_reference: 3.0
  weight_shortest_path: 0.0

  # ⚠️ 穿障修复：从5恢复到20，恢复避障约束优先级，绝对不能再低于10
  weight_obstacle: 20.0

  # ⚠️ 穿障修复：从0.1提高到0.2，加强膨胀区惩罚，不会靠近障碍物太近
  weight_inflation: 0.2

  # ⚠️ 穿障修复：从8降到3，平衡路径跟踪和避障，不会为了走路径而穿障
  weight_viapoint: 3.0

  weight_adapt_factor: 2.0

  # ============================================================================
  # [8] 多拓扑路径探索（穿障修复核心！）
  # ============================================================================

  # ⚠️ 穿障修复：重新开启多拓扑规划，2条路径，既能找不穿障的路，又不纠结
  enable_homotopy_class_planning: true
  enable_multithreading: true
  max_number_classes: 2
  selection_cost_hysteresis: 1.2
  selection_prefer_initial_plan: 0.95
  selection_obst_cost_scale: 3.0 # 路径选择时优先考虑避障
  selection_viapoint_cost_scale: 1.0

  # ============================================================================
  # [9] 足迹模型（必须和代价地图完全一致）
  # ============================================================================
  footprint_model:
    type: "polygon"
    vertices: [[-0.306, -0.290], [-0.306, 0.290], [0.306, 0.290], [0.306, -0.290]]
