# filepath: src/scout_nav/param/dwa_local_planner_params.yaml
# ============================================================================
# DWA (Dynamic Window Approach) 动态窗口法局部规划器
#
# 核心算法流程（每个控制周期 10Hz 执行一次）：
#   1. 以当前速度 (v_x, v_θ) 为中心，开一个"动态窗口"
#      窗口大小由 acc_lim_x/acc_lim_theta 和控制周期决定
#   2. 在窗口内均匀采样 vx_samples × vtheta_samples 组候选速度
#   3. 对每组候选��度做前向模拟：假设以该速度匀速运动 sim_time 秒，
#      生成一条弧线轨迹
#   4. 用加权代价函数评估每条轨迹：
#      cost = path_distance_bias × (离全局路径距离)
#           + goal_distance_bias × (离目标点距离)
#           + occdist_scale × (离最近障碍物的反距离)
#   5. 选择总代价最低的速度发送给底盘
#
# 适用场景：空旷大厅、宽走廊（计算快、稳定）
# 弱点：在狭窄空间/急弯处不如 TEB 灵活
# ============================================================================
DWAPlannerROS:

  # ============================================================================
  # [1] 速度极值
  # ============================================================================
  # ⚠️ 基于 Scout Mini 物理参数设定
  # 车重 23kg + 最大载重 10kg = 总重 33kg
  # 为确保安全制动距离，最大速度限制在 0.5m/s

  # max_vel_x: 最大前进线速度（m/s）
  # 0.5m/s 下制动距离约 0.5²/(2×1.0) = 0.125m（12.5cm），安全
  max_vel_x: 0.5

  # min_vel_x: 最小前进线速度（m/s）
  # 负值表示允许倒车（脱困时需要后退）
  min_vel_x: -0.2

  # max_vel_y / min_vel_y: 侧向线速度（m/s）
  # 0.0: Scout Mini 是滑移转向底盘，无法侧向平移
  # 只有 Mecanum/Omni 全向轮底盘才能设非零值
  max_vel_y: 0.0
  min_vel_y: 0.0

  # max_vel_trans: 最大合成平移速度（m/s）
  # 非全向底盘时等于 max_vel_x
  max_vel_trans: 0.5

  # min_vel_trans: 最小合成平移速度（m/s）
  # 0.05: 防止速度过低落入电机死区（底盘不动但以为在走）
  min_vel_trans: 0.05

  # max_vel_theta: 最大旋转角速度（rad/s）
  # 1.0 rad/s ≈ 57°/s：滑移转向底盘旋转能力强，但过快会侧翻
  max_vel_theta: 1.0

  # min_vel_theta: 最小旋转角速度（rad/s）
  # 0.1: 低于此值时静摩擦力可能阻止底盘旋转
  min_vel_theta: 0.1

  # ============================================================================
  # [2] 加速度限制
  # ============================================================================
  # ⚠️ 33kg 总重的惯性约束

  # acc_lim_x: X 轴最大加速度（m/s²）
  # F = ma → 1.0 m/s² × 33kg = 33N 驱动力需求，Scout Mini 可轻松提供
  # 从静止加速到 max_vel_x 需 0.5/1.0 = 0.5s，体感平滑
  acc_lim_x: 1.0

  # acc_lim_y: Y 轴最大加速度
  # 0.0: 滑移转向无侧向加速
  acc_lim_y: 0.0

  # acc_lim_theta: 旋转最大角加速度（rad/s²）
  # 2.0: 从静止加速到 max_vel_theta 需 1.0/2.0 = 0.5s
  acc_lim_theta: 2.0

  # ============================================================================
  # [3] 速度采样参数
  # ============================================================================

  # vx_samples: X 轴速度采样数
  # 在 [min_vel_x, max_vel_x] 中均匀取 20 个值
  vx_samples: 20

  # vy_samples: Y 轴速度采样数
  # 1: 非全向底盘 vy 恒为 0，只需 1 个采样
  vy_samples: 1

  # vtheta_samples: 角速度采样数
  # 在 [-max_vel_theta, max_vel_theta] 中均匀取 40 个值
  # 共评估 20×1×40 = 800 条候选轨迹/周期
  vtheta_samples: 40

  # sim_time: 轨迹前向模拟时长（秒）
  # 1.5s: 以 0.5m/s 前进可看到 0.75m 前方的轨迹
  # 太短→只看眼前容易钻入死胡同；太长→计算量大且远期预测不准
  sim_time: 1.5

  # sim_granularity: 轨迹模拟步长（米）
  # 0.025: 每 2.5cm 生成一个轨迹检查点
  sim_granularity: 0.025

  # ============================================================================
  # [4] 代价函数权重（★ 核心调参区域 ★）
  # ============================================================================

  # path_distance_bias: 全局路径贴合度权重
  # 轨迹终点离全局路径越近代价越低
  # 32.0: 中等偏高→机器人大致沿全局路径行走，不会大幅偏离
  # 增大→更贴合全局路径；减小→允许局部绕行
  path_distance_bias: 32.0

  # goal_distance_bias: 目标点趋近权重
  # 轨迹终点离目标越近代价越低
  # 20.0: 中等→既追目标又不忽视路径
  goal_distance_bias: 20.0

  # occdist_scale: 障碍物距离权重
  # 轨迹离最近障碍物越近代价越高
  # 0.05: 适中→不会让机器人过度恐惧障碍物
  # ⚠️ 如果机器人在走廊中走 S 形→此值太大，需减小
  # ⚠️ 如果机器人频繁撞障碍物→需增大
  occdist_scale: 0.05

  # forward_point_distance: 前方评估点距离（米）
  # DWA 在轨迹前方此距离处额外评估一个点的代价
  # 0.325 ≈ 车体半长（0.306m），确保车头不会探入障碍物
  forward_point_distance: 0.325

  # stop_time_buffer: 制动时间余量（秒）
  # 确保当前速度在此时间内能完全刹停
  stop_time_buffer: 0.3

  # scaling_speed: 缩放速度阈值（m/s）
  scaling_speed: 0.25

  # max_scaling_factor: 最大缩放因子
  max_scaling_factor: 0.2

  # ============================================================================
  # [5] 目标容忍度
  # ============================================================================

  # xy_goal_tolerance: 到达目标的位置容忍度（米）
  # 0.15: 距目标 15cm 以内视为"到达"
  xy_goal_tolerance: 0.15

  # yaw_goal_tolerance: 到达目标的朝向容忍度（弧度）
  # 0.2 rad ≈ 11.5°
  yaw_goal_tolerance: 0.2

  # latch_xy_goal_tolerance: 位置锁定
  # true: 一旦位置满足容忍度，后续只调朝向（防止调朝向时位置又超出）
  latch_xy_goal_tolerance: true

  # ============================================================================
  # [6] 振荡抑制
  # ============================================================================
  # oscillation_reset_dist: 移动超过此距离后重置振荡检测计时器
  oscillation_reset_dist: 0.05