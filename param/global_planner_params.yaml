# filepath: src/scout_nav/param/global_planner_params.yaml
# ======================================================================
# GlobalPlanner (A* 专属量产稳定版配置)
# 
# 核心解决痛点：
# 1. 坚持使用 A* 算法，极大降低大地图下的 CPU 算力消耗。
# 2. 彻底解决 A* 与 梯度下降法 冲突导致的 "NO PATH!" 报错崩溃问题。
# 3. 避免路径贴墙，强制引导机器人走狭窄通道的正中心。
# ======================================================================

GlobalPlanner:
  # ==========================================
  # 1. 核心算法选择
  # ==========================================
  # 设为 false 启用 A* 算法，极大节省算力，适合大场地。
  use_dijkstra: false
  
  # 设置为 false。既然用了 A* 和网格寻路，二次函数近似的意义不大，
  # 关闭它可以进一步节省算力并降低在边缘处势场计算出错的概率。
  use_quadratic: true
  
  # ==========================================
  # 2. 网格与平滑度 (解决 A* 报错的核心关键)
  # ==========================================
  # 【必须设为 true！】
  # A* 算法没有全图势场，绝对不能用梯度下降法(false)。必须设为 true 使用网格提取路径！
  # 注：这会使 RViz 中的全局红线变成阶梯状，但底层的 TEB 规划器会自动将其平滑成实车优美的控制曲线，无需担心抖动。
  use_grid_path: false
  
  # ==========================================
  # 3. 应对“贴墙症”的防撞三剑客 (配合 Costmap 膨胀层使用)
  # 通过调整这三个参数，可以把红线死死逼到走廊的正中间。
  # ==========================================
  # 致命代价值，保持默认。大于等于此值的区域被视为墙壁，绝对不能走。
  lethal_cost: 253
  
  # 基础代价值（默认 50）。稍微调高点 (例如 60-80)，会让规划器倾向于走直线，避免为了极其微小的代价差异而去绕弯探索。
  neutral_cost: 66
  
  # 代价乘数系数（默认 3.0）。调大它，A* 算法会对 Costmap 里的膨胀斜坡极其敏感，主动远离墙壁。
  cost_factor: 10
  
  # ==========================================
  # 4. 路径点朝向处理 (Yaw 角插值)
  # ==========================================
  # 0=无朝向(None), 1=向前(Forward), 2=向后插值(Interpolate), 3=向右(Forward then Interpolate)。
  # 强烈建议实车设为 1，这会让每一个路径点的朝向都顺着红线的切线方向。TEB 拿到这根线后，车体转弯预判会自然得多。
  orientation_mode: 1
  
  # 用于计算朝向平滑的窗口大小（单位：个网格点）。
  orientation_window_size: 1
  
  # ==========================================
  # 5. 容错与可视化配置
  # ==========================================
  # 是否允许在未知空间（代价为255的灰色区域）中进行路径规划。
  # 实车建图往往有扫不到的盲区，必须设为 true。
  allow_unknown: true
  
  # 目标点容差（米）。由于 TEB 局部规划器里已经有 xy_goal_tolerance 了，全局这里设为 0.0 即可，避免两套容差打架。
  default_tolerance: 0.0
  
  # 是否发布代价势场图 (Topic: /move_base/GlobalPlanner/potential)。
  # 因为用的是 A*，势场图只会显示一条“沟壑”而不是全图水波纹。量产时建议设为 false 节省带宽。
  publish_potential: true