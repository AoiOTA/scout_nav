#!/usr/bin/env python
# filepath: src/scout_nav/cfg/Extrinsics.cfg
# ============================================================================
# 动态参数定义文件：双阶全归零标定的 7 个物理参数
#
# 参数分为两组：
#   第一阶（底盘高度）：base_z_offset — base_footprint 到 base_link 的 Z 高度
#   第二阶（雷达外参）：x, y, z, roll, pitch, yaw — base_link 到 velodyne 的 6DOF
#
# 所有默认值强制为 0.0（零信任标定原则）
# ============================================================================

# 导入 dynamic_reconfigure 的参数生成器
from dynamic_reconfigure.parameter_generator_catkin import *

# 创建参数生成器实例
gen = ParameterGenerator()

# ============================================================================
# 第一阶参数：底盘离地高度
# ============================================================================
# base_z_offset: base_footprint(地面Z=0) 到 base_link(车体中心) 的 Z 轴高度
# 物理意义：底盘几何中心距离真实地面的高度（米）
# 理论值：约 wheel_radius - wheel_vertical_offset = 0.160 - (-0.101) = 0.261m
# 但实际受轮胎气压、悬挂负载影响，必须实测！
# 范围 0~0.5m：从地面到最高可能离地高度
# 默认 0.0：全归零原则，初始时 base_link 与 base_footprint 完全重合
gen.add("base_z_offset", double_t, 0,
        "Stage-1: Height from ground(base_footprint) to base_link center, unit: m",
        0.0, 0.0, 0.5)

# ============================================================================
# 第二阶参数：雷达 6 自由度外参
# ============================================================================
# x: base_link 到 velodyne 的前后偏移（车头方向为正），单位：米
# 雷达安装在车顶偏前部，真实值约 0.0~0.2m
gen.add("x", double_t, 0,
        "Stage-2: Lidar X offset (forward+), unit: m",
        0.0, -1.0, 1.0)

# y: base_link 到 velodyne 的左右偏移（左方为正），单位：米
# 雷达通常在中轴线上，真实值接近 0
gen.add("y", double_t, 0,
        "Stage-2: Lidar Y offset (left+), unit: m",
        0.0, -1.0, 1.0)

# z: base_link 到 velodyne 的上下偏移（上方为正），单位：米
# 雷达在车顶上方，真实值约 0.1~0.4m（相对 base_link，非相对地面！）
gen.add("z", double_t, 0,
        "Stage-2: Lidar Z offset (up+), unit: m",
        0.0, -0.5, 1.5)

# roll: 绕 X 轴旋转（滚转），单位：弧度
gen.add("roll", double_t, 0,
        "Stage-2: Lidar Roll (around X), unit: rad",
        0.0, -0.5, 0.5)

# pitch: 绕 Y 轴旋转（俯仰），单位：弧度
gen.add("pitch", double_t, 0,
        "Stage-2: Lidar Pitch (around Y), unit: rad",
        0.0, -0.5, 0.5)

# yaw: 绕 Z 轴旋转（偏航），单位：弧度
gen.add("yaw", double_t, 0,
        "Stage-2: Lidar Yaw (around Z), unit: rad",
        0.0, -0.5, 0.5)

# ============================================================================
# 生成参数服务
# PACKAGE = "scout_nav"
# NODE = "dynamic_tf_broadcaster"（使用此参数的节点名）
# CFG_NAME = "Extrinsics"（生成的代码文件前缀）
# ============================================================================
exit(gen.generate("scout_nav", "dynamic_tf_broadcaster", "Extrinsics"))